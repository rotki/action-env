name: '@rotki/action-env'
description: Loads environment variables for a job from a file
author: Rotki Solutions GmbH
branding:
  icon: file-text
  color: green
inputs:
  env_file:
    required: true
    description: The path to the environment file where the variables will be loaded from
runs:
  using: node24
  main: dist/index.js
